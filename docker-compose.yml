services:
  vulnerable-agent:
    build: .
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434/api/chat
    command: uvicorn app.vulnerable_agent:app --host 0.0.0.0 --port 8000

  protected-agent:
    build: .
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434/api/chat
    command: uvicorn app.protected_agent:app --host 0.0.0.0 --port 8001